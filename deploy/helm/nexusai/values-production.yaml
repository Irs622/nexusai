# Production overrides. Secrets come from the `nexusai-secrets` Secret (see values.yaml).
replicaCount:
  # SQLite-backed state: a single control-plane replica until a shared database backend
  # exists. The chart refuses >1 unless persistence.allowSharedSqlite=true.
  controlPlane: 1

image:
  repository: nexusai/runtime
  pullPolicy: Always
  tag: "1.0.0-prod"
  # Clear the base digest so the tag above is actually used; pin a digest here instead.
  digest: ""

networkPolicy:
  enabled: true

persistence:
  enabled: true
  storageClass: "standard"
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /data

env:
  NEXUSAI_ENV: "production"
