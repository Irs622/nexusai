{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-control-plane
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexusai-control-plane
    {{- include "nexusai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: nexusai-control-plane
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
