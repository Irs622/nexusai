{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexusai-default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nexusai-sandbox-isolation
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: nexusai-sandbox
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: nexusai-worker
      ports:
        - protocol: TCP
          port: 50051
  egress: []
{{- end }}
