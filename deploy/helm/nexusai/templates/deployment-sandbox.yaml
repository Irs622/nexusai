{{- if .Values.sandbox.enabled }}
{{- if not .Values.sandbox.command }}
{{- fail "sandbox.enabled=true requires sandbox.command: the image has no dedicated sandbox gateway entrypoint yet." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-sandbox
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexusai-sandbox
    {{- include "nexusai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.sandbox }}
  selector:
    matchLabels:
      app: nexusai-sandbox
  template:
    metadata:
      labels:
        app: nexusai-sandbox
        {{- include "nexusai.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: sandbox
          image: {{ include "nexusai.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.sandbox.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.sandbox | nindent 12 }}
          ports:
            - containerPort: 50051
              name: gateway
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
{{- end }}
