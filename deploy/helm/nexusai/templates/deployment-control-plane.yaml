apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-control-plane
  labels:
    app: nexusai-control-plane
spec:
  replicas: {{ .Values.replicaCount.controlPlane }}
  selector:
    matchLabels:
      app: nexusai-control-plane
  template:
    metadata:
      labels:
        app: nexusai-control-plane
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ if .Values.image.digest }}{{ .Values.image.repository }}@{{ .Values.image.digest }}{{ else }}{{ .Values.image.repository }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: {{ .Values.resources.controlPlane.limits.cpu }}
              memory: {{ .Values.resources.controlPlane.limits.memory }}
            requests:
              cpu: {{ .Values.resources.controlPlane.requests.cpu }}
              memory: {{ .Values.resources.controlPlane.requests.memory }}
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.probes.readiness.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.probes.liveness.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
