{{- if .Values.worker.enabled }}
{{- if not .Values.worker.command }}
{{- fail "worker.enabled=true requires worker.command: the image has no dedicated worker entrypoint yet, and without a command the pod would run the control-plane API." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexusai-worker
  namespace: {{ .Release.Namespace }}
  labels:
    app: nexusai-worker
    {{- include "nexusai.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount.worker }}
  selector:
    matchLabels:
      app: nexusai-worker
  template:
    metadata:
      labels:
        app: nexusai-worker
        {{- include "nexusai.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "nexusai.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "nexusai.env" . | trim | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          volumeMounts:
            # Workers get pod-local scratch storage; the control-plane PVC is ReadWriteOnce.
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpSizeLimit }}
        - name: logs
          emptyDir:
            sizeLimit: {{ .Values.logsSizeLimit }}
{{- end }}
