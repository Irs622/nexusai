version: "3.9"

services:
  nexusai:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexusai/runtime:1.0.0
    container_name: nexusai-runtime
    ports:
      # Bind to loopback only: development mode is not hardened for network exposure.
      - "127.0.0.1:8080:8080"
    environment:
      - NEXUSAI_ENV=development
      # Set NEXUSAI_ADMIN_API_KEY in your shell or .env; otherwise a random key is generated
      # at startup and printed to the container logs.
      - NEXUSAI_ADMIN_API_KEY=${NEXUSAI_ADMIN_API_KEY:-}
      - PORT=8080
      - SQLITE_DB_PATH=/app/data/nexusai.db
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - nexusai_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: nexusai-redis
    # Redis has no authentication here; it is reachable only on the compose network.
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  nexusai_data:
  redis_data:
