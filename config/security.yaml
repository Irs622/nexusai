# Security Configuration & Blacklists

security:
  strict_mode: true
  auto_approve_low_risk: false
  
  # Command blacklists for shell execution
  forbidden_commands:
    - "rm -rf /"
    - "rm -rf ~"
    - "mkfs"
    - "dd if="
    - "> /dev/sda"
    - ":(){ :|:& };:"
    - "chmod -R 777 /"
    - "sudo rm -rf"
  
  # Restricted system paths
  protected_paths:
    - "/System"
    - "/usr/bin"
    - "/bin"
    - "/sbin"
    - "/etc"
    - "/var"
    - "~/.ssh"
    - "~/.aws"
    - "~/.config"
    - "~/.gnupg"
    - "~/Library/Keychains"
    - "/var/run/docker.sock"
