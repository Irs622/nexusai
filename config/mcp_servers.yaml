# Model Context Protocol (MCP) Server Configurations for NexusAI
#
# Built-in Native MCP Server Pack (Python 3.12+ stdio JSON-RPC 2.0)
# Running out-of-the-box without requiring external npm or uvx dependencies.

mcp_servers:
  # 1. Native Sandboxed Filesystem MCP Server
  filesystem:
    command: "python3"
    args: ["-m", "nexusai.tools.mcp.servers.filesystem", "--root", "storage"]
    env:
      PYTHONPATH: "src:."
    enabled: true
    risk_level: "MEDIUM"
    timeout_seconds: 30.0

  # 2. Native Asynchronous SQLite MCP Server
  sqlite:
    command: "python3"
    args: ["-m", "nexusai.tools.mcp.servers.sqlite", "--db-path", "storage/nexus.db"]
    env:
      PYTHONPATH: "src:."
    enabled: true
    risk_level: "MEDIUM"
    timeout_seconds: 30.0

  # 3. Native Web Fetcher & HTTP MCP Server
  web_fetcher:
    command: "python3"
    args: ["-m", "nexusai.tools.mcp.servers.web_fetcher"]
    env:
      PYTHONPATH: "src:."
    enabled: true
    risk_level: "MEDIUM"
    timeout_seconds: 30.0

