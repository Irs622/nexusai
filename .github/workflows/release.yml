name: "Release & Publish"

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release-validation:
    name: Release Candidate Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pyproject version v${PKG_VERSION}"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"

      # Tests (ci-pr mode), architecture validation, security audit, and fresh-install
      # validation. Any failure stops the release.
      - name: Execute Release Quality Gate
        run: python tools/run_quality_gate.py --release

  release:
    name: Build & Release Package
    needs: [release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build twine

      - name: Build package
        run: python -m build

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
