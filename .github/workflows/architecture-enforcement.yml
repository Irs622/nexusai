name: Architecture Enforcement & Dependency Boundaries

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  architecture-check:
    name: Architecture Enforcement Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"

      - name: Run Architecture Enforcement Test Suite
        run: |
          python3 tools/run_architecture_tests.py

      - name: Archive Dependency Graph Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-graph
          path: reports/dependency_graph.json

