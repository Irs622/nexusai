name: Master CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  ci-quality-gate:
    name: Full Quality Gate Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y portaudio19-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Execute Master Quality Gate
        run: |
          python tools/run_quality_gate.py
      - name: Upload Benchmark & Coverage Artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-quality-artifacts
          path: |
            benchmarks/history/
            coverage.xml
