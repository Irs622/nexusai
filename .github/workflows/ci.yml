name: Master CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  ci-quality-gate:
    name: Full Quality Gate Verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y portaudio19-dev libasound2-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"
      - name: Execute Master Quality Gate
        run: |
          python tools/run_quality_gate.py
      - name: Upload Benchmark & Coverage Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ci-quality-artifacts
          path: |
            benchmarks/history/
            coverage.xml
