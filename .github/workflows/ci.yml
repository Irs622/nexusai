name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Pytest with Coverage
        run: |
          pytest --cov=src/nexusai --cov-report=term-missing --cov-fail-under=85
      - name: Run Benchmark Quality Gate Check
        run: |
          python benchmarks/check_regressions.py
      - name: Upload Benchmark & Coverage Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ci-quality-artifacts
          path: |
            benchmarks/history/
            coverage.xml
