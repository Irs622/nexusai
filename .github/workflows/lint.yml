name: Static Lint & Code Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Static Analysis (Ruff, Black, isort, MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y portaudio19-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Formatter Check (Black & isort)
        run: |
          python tools/run_formatter.py
      - name: Run Static Linter Check (Ruff)
        run: |
          python tools/run_linter.py
      - name: Run Static Type Checker (MyPy)
        run: |
          python tools/run_typecheck.py
