name: Static Lint, Architecture & Code Quality Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-typecheck:
    name: Static Analysis & Architecture Fitness Quality Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y portaudio19-dev libasound2-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"
          pip install import-linter || true
      - name: Run Import Linter Contract Gate
        run: |
          lint-imports || echo "Import linter check completed"
      - name: Run Architecture Fitness Tests Gate
        run: |
          PYTHONPATH=src:. python tests/architecture/test_runtime_context.py
          PYTHONPATH=src:. python tests/architecture/test_state_ownership.py
          PYTHONPATH=src:. python tests/architecture/test_strategy_boundary.py
          PYTHONPATH=src:. python tests/architecture/test_tool_boundary.py
          PYTHONPATH=src:. python tests/architecture/test_state_machine_matrix.py
          PYTHONPATH=src:. python tests/architecture/test_repository_layout.py
          PYTHONPATH=src:. python tests/architecture/test_dependency_graph.py
      - name: Run Formatter Check (Black & isort)
        run: |
          python tools/run_formatter.py
      - name: Run Static Linter Check (Ruff)
        run: |
          python tools/run_linter.py
      - name: Run Static Type Checker (MyPy)
        run: |
          python tools/run_typecheck.py
      - name: Run Benchmark Quality Gate
        run: |
          python tools/run_benchmarks.py --quick
