name: Security & License Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read

jobs:
  security-audit:
    name: CVE Vulnerability Scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y portaudio19-dev libasound2-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"
      - name: Run CVE Vulnerability Audit
        run: |
          python tools/run_security_audit.py

  license-check:
    name: Dependency License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install System Dependencies
        run: |
          sudo apt-get update -y || true
          sudo apt-get install -y portaudio19-dev libasound2-dev || true
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatchling build
          pip install -e ".[dev]"
      - name: Run License Compliance Check
        run: |
          python tools/run_license_check.py
