[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai"
version = "0.6.0"
description = "NexusAI: Personal AI Operating System & Agent Runtime Engine"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pytz>=2026.3.post1",
    "openai>=1.14.0",
    "aiosqlite>=0.19.0",
    "psutil>=7.2.2",
    "chromadb>=0.4.24",
    "SpeechRecognition>=3.10.0",
    "apscheduler>=3.10.0,<4.0.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "fastapi>=0.141.1",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
audio = ["pyaudio>=0.2.14"]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "isort>=5.13.0",
    "types-pyyaml>=6.0.12",
    "mutmut>=2.4.0",
    "pip-audit>=2.7.0",
    "pip-licenses>=4.4.0",
]

[project.scripts]
nexusai = "nexusai.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
addopts = ["--strict-markers"]
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests requiring local services (ChromaDB, filesystem)",
    "contract: provider wire-format and protocol conformance tests",
    "benchmark: latency and regression benchmark tests",
    "stress: high-concurrency and load tests",
    "network: tests requiring live external API access",
    "snapshot: API compatibility golden snapshot tests",
    "architecture: import boundary and layer rule enforcement",
    "security: security audit and vulnerability tests",
    "slow: long-running tests (>5s)",
]

[tool.coverage.run]
branch = true
source = ["src/nexusai"]
omit = ["tests/acceptance/*"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

[tool.mutmut]
paths_to_mutate = "src/nexusai/core,src/nexusai/kernel,src/nexusai/memory/domain"
runner = "pytest"
tests_dir = "tests"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = false
warn_return_any = true
warn_unused_configs = true
mypy_path = "src:."

[tool.pyrefly]
project-roots = ["src", "."]
search-path = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "I001"]

[tool.isort]
profile = "black"
line_length = 100

[tool.black]
line-length = 100
target-version = ['py312']
