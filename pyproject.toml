[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai"
version = "0.1.0"
description = "NexusAI: Personal AI Operating System for macOS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "loguru>=0.7.2",
    "pyyaml>=6.0.1",
    "pytz>=2024.1",
    "openai>=1.14.0",
    "aiosqlite>=0.19.0",
    "psutil>=5.9.0",
    "chromadb>=0.4.24",
    "SpeechRecognition>=3.10.0",
    "pyaudio>=0.2.14",
    "apscheduler>=3.10.0,<4.0.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "types-pyyaml>=6.0.12",
]

[project.scripts]
nexusai = "nexusai.cli.app:app"

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.black]
line-length = 100
target-version = ['py312']
